server {
    listen       80;
    server_name  _;

    # Serve static files from the Vite build output
    root   /usr/share/nginx/html;
    index  index.html;

    # ── SPA Fallback ──────────────────────────────────────────
    # All routes that don't match a real file are served
    # index.html so React Router can handle them client-side.
    # This makes the following routes work correctly after a
    # hard refresh or when opened directly:
    #   /
    #   /login  /signup
    #   /dashboard
    #   /new-analysis
    #   /history
    #   /reports
    #   /analysis/:id
    # ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets — aggressive cache headers ────────────
    # Vite hashes asset filenames (e.g. index-D8dGoVQ0.js),
    # so they can be cached indefinitely by the browser.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Favicon / icons — short cache ───────────────────────
    location ~* \.(svg|ico|png|webp|jpg|jpeg|gif)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
}
