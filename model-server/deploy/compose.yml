# Optional self-hosted model-server infrastructure. Does not alter the app's root Compose.
services:
  metadata:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: satquery_models
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: ${MODEL_DB_PASSWORD:?Set MODEL_DB_PASSWORD}
    volumes: [metadata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U satquery -d satquery_models']
      interval: 5s
      retries: 10
  objects:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MODEL_S3_USER:?Set MODEL_S3_USER}
      MINIO_ROOT_PASSWORD: ${MODEL_S3_PASSWORD:?Set MODEL_S3_PASSWORD}
    volumes: [objects:/data]
    ports: ['127.0.0.1:9001:9001']
  vectors:
    image: qdrant/qdrant:v1.14.1
    volumes: [vectors:/qdrant/storage]
  queue:
    image: valkey/valkey:8
    command: valkey-server --appendonly yes
    volumes: [queue:/data]
  model-server: &runtime
    build: ..
    environment: &runtime_env
      MODEL_BACKEND: ${MODEL_BACKEND:-ollama}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:7b}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8002}
      VLLM_MODEL: ${VLLM_MODEL:-satquery-rs}
      RUNTIME_DATABASE_URL: postgresql+psycopg://satquery:${MODEL_DB_PASSWORD}@metadata:5432/satquery_models
      RUNTIME_S3_ENDPOINT: http://objects:9000
      RUNTIME_S3_BUCKET: satquery
      RUNTIME_S3_ACCESS_KEY: ${MODEL_S3_USER}
      RUNTIME_S3_SECRET_KEY: ${MODEL_S3_PASSWORD}
      RUNTIME_QDRANT_URL: http://vectors:6333
      RUNTIME_QUEUE_URL: redis://queue:6379/0
      RUNTIME_GATEWAY_KEY: ${MODEL_GATEWAY_KEY:?Set MODEL_GATEWAY_KEY}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:8001:8001']
    depends_on:
      metadata:
        condition: service_healthy
      objects:
        condition: service_started
      vectors:
        condition: service_started
      queue:
        condition: service_started
  worker:
    <<: *runtime
    ports: []
    command: celery -A app.runtime.worker.celery_app worker --loglevel=INFO --concurrency=1
volumes:
  metadata:
  objects:
  vectors:
  queue:
